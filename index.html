<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROSÉS — Jugo de Uva AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}body{position:fixed;inset:0}
video,#mindar-video{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:0!important;display:block!important}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important;background:transparent!important}
a-scene canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important;background:transparent!important}
#ui{position:fixed;z-index:20;top:0;left:0;right:0;text-align:center;color:#fff;padding:14px;text-shadow:0 2px 10px #000;background:linear-gradient(#000b,transparent);pointer-events:none}#ui b{font-size:23px}
.btn{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:11px 15px;font-weight:800;color:#5b1a86;background:#fff}.pill{position:fixed;z-index:30;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#111c;padding:10px 17px;border-radius:99px;white-space:nowrap}
</style>
</head>
<body>
<div id="ui"><b>🍇 ROSÉS — Jugo de Uva</b></div>
<button class="btn" id="sound">🎵 Activar música</button>
<div class="pill" id="status">Iniciando cámara…</div>
<a-scene id="scene" embedded mindar-image="imageTargetSrc:./targets.mind;uiLoading:no;uiError:no;uiScanning:no;filterMinCF:.001;filterBeta:10" renderer="alpha:true;clearAlpha:0;antialias:true;colorManagement:true;precision:high" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0">
<a-entity id="life" visible="false">
<!-- IMPORTANTE: la cabeza NO se vuelve a dibujar. Es la uva impresa en la caja real. -->
<a-entity id="armL" position="-.18 -.34 .12">
  <a-image src="./assets/upper-arm-flex.svg" position="-.07 0 0" width=".22" height=".17" material="transparent:true;shader:flat;side:double"></a-image>
  <a-entity id="elbowL" position="-.14 0 0">
    <a-image src="./assets/forearm-flex.svg" position="-.07 -.01 0" width=".22" height=".16" material="transparent:true;shader:flat;side:double"></a-image>
    <a-entity id="wristL" position="-.14 -.01 0">
      <a-image src="./assets/hand-open.svg" position="-.07 -.01 0" width=".16" height=".16" material="transparent:true;shader:flat;side:double"></a-image>
    </a-entity>
  </a-entity>
</a-entity>
<a-entity id="armR" position=".18 -.34 .12">
  <a-image src="./assets/upper-arm-flex.svg" position=".07 0 0" width=".22" height=".17" material="transparent:true;shader:flat;side:double"></a-image>
  <a-entity id="elbowR" position=".14 0 0">
    <a-image src="./assets/forearm-flex.svg" position=".07 -.01 0" width=".22" height=".16" material="transparent:true;shader:flat;side:double"></a-image>
    <a-entity id="wristR" position=".14 -.01 0">
      <a-image src="./assets/hand-open.svg" position=".07 -.01 0" width=".16" height=".16" material="transparent:true;shader:flat;side:double"></a-image>
    </a-entity>
  </a-entity>
</a-entity>
<a-entity id="legL" position="-.075 -.57 .11">
  <a-image src="./assets/thigh-flex.svg" position="0 -.10 0" width=".16" height=".23" material="transparent:true;shader:flat;side:double"></a-image>
  <a-entity id="kneeL" position="0 -.21 0">
    <a-image src="./assets/shin-flex.svg" position="-.01 -.09 0" width=".15" height=".22" material="transparent:true;shader:flat;side:double"></a-image>
    <a-entity id="ankleL" position="-.01 -.20 0"><a-image src="./assets/shoe.svg" position="-.035 -.055 0" width=".24" height=".15" material="transparent:true;shader:flat;side:double"></a-image></a-entity>
  </a-entity>
</a-entity>
<a-entity id="legR" position=".075 -.57 .11">
  <a-image src="./assets/thigh-flex.svg" position="0 -.10 0" width=".16" height=".23" material="transparent:true;shader:flat;side:double"></a-image>
  <a-entity id="kneeR" position="0 -.21 0">
    <a-image src="./assets/shin-flex.svg" position=".01 -.09 0" width=".15" height=".22" material="transparent:true;shader:flat;side:double"></a-image>
    <a-entity id="ankleR" position=".01 -.20 0"><a-image src="./assets/shoe.svg" position=".035 -.055 0" width=".24" height=".15" material="transparent:true;shader:flat;side:double"></a-image></a-entity>
  </a-entity>
</a-entity>
</a-entity>
</a-entity>
</a-scene>
<script>
const $=s=>document.querySelector(s),scene=$("#scene"),target=$("#target"),life=$("#life"),status=$("#status"),sound=$("#sound");
let audio=null,active=false,start=0,mode=0;
function cameraLayer(){document.querySelectorAll("video,#mindar-video").forEach(v=>{v.style.position="fixed";v.style.left="0";v.style.top="0";v.style.width="100%";v.style.height="100%";v.style.objectFit="cover";v.style.zIndex="0";v.style.display="block"});const c=document.querySelector("a-scene canvas");if(c){c.style.position="fixed";c.style.left="0";c.style.top="0";c.style.width="100%";c.style.height="100%";c.style.zIndex="1";c.style.background="transparent"}}
scene.addEventListener("loaded",()=>setTimeout(cameraLayer,300));scene.addEventListener("arReady",()=>{cameraLayer();status.textContent="Apunta a la caja…"});new MutationObserver(cameraLayer).observe(document.body,{childList:true,subtree:true});
target.addEventListener("targetFound",()=>{active=true;start=performance.now();life.object3D.visible=true;status.textContent="✨ ¡La uva cobró vida!"});target.addEventListener("targetLost",()=>{active=false;life.object3D.visible=false;status.textContent="Apunta nuevamente a la caja…"});
function wave(t){if(!active)return;const s=(t-start)/1000;const beat=Math.sin(s*3.4),slow=Math.sin(s*1.7),alt=Math.sin(s*1.7+1.4);const armL=$("#armL"),armR=$("#armR"),elL=$("#elbowL"),elR=$("#elbowR"),wL=$("#wristL"),wR=$("#wristR"),legL=$("#legL"),legR=$("#legR"),kL=$("#kneeL"),kR=$("#kneeR"),aL=$("#ankleL"),aR=$("#ankleR");
armL.object3D.rotation.z=-0.10+beat*0.12;armR.object3D.rotation.z=0.10-beat*0.12;elL.object3D.rotation.z=-0.18-alt*0.18;elR.object3D.rotation.z=0.18+alt*0.18;wL.object3D.rotation.z=0.18+beat*0.12;wR.object3D.rotation.z=-0.18-beat*0.12;
legL.object3D.rotation.z=0.04+slow*0.08;legR.object3D.rotation.z=-0.04-slow*0.08;kL.object3D.rotation.z=-0.12+alt*0.16;kR.object3D.rotation.z=0.12-alt*0.16;aL.object3D.rotation.z=alt*0.10;aR.object3D.rotation.z=-alt*0.10;
life.object3D.position.y=Math.sin(s*3.4)*0.018;life.object3D.rotation.z=Math.sin(s*1.7)*0.025;requestAnimationFrame(wave)}
requestAnimationFrame(wave);
sound.onclick=()=>{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();sound.textContent="🔊 Música activada";const notes=[392,440,523,587,659,587,523,440,523,587,659,784];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.13;o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.11);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.12)})};
</script>
</body>
</html>
