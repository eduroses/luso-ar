<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROSÉS — Jugo de Uva AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
body{position:fixed;inset:0}
video{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:0!important;display:block!important;background:#000!important}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}
a-scene canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important;background:transparent!important}
#ui{position:fixed;z-index:20;top:0;left:0;right:0;text-align:center;color:#fff;padding:14px;text-shadow:0 2px 10px #000;background:linear-gradient(#000b,transparent);pointer-events:none}
#ui b{font-size:23px}.btn{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:11px 15px;font-weight:800;color:#5b1a86;background:#fff}.pill{position:fixed;z-index:30;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#111c;padding:10px 17px;border-radius:99px;white-space:nowrap}
</style>
</head>
<body>
<div id="ui"><b>🍇 ROSÉS — Jugo de Uva</b></div>
<button class="btn" id="sound">🎵 Activar música</button>
<div class="pill" id="status">Iniciando cámara…</div>
<a-scene id="scene" embedded mindar-image="imageTargetSrc:./targets.mind;uiLoading:no;uiError:no;uiScanning:no;filterMinCF:.001;filterBeta:10" renderer="alpha:true;colorManagement:true;antialias:true;precision:high" color-space="sRGB" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0">
<a-entity id="life" visible="false">
<a-image id="grape" src="./assets/grape.webp" position="0 -.53 .11" width=".42" height=".55" material="transparent:true;shader:flat;side:double"></a-image>
<a-entity id="armL" position="-.245 -.52 .095"><a-image src="./assets/upper-arm-flex.svg" position="-.10 0 0" width=".28" height=".20" material="transparent:true;shader:flat"></a-image><a-image src="./assets/forearm-flex.svg" position="-.28 -.02 0" width=".27" height=".19" material="transparent:true;shader:flat"></a-image><a-image src="./assets/hand-open.svg" position="-.43 -.05 0" width=".18" height=".18" material="transparent:true;shader:flat"></a-image></a-entity>
<a-entity id="armR" position=".245 -.52 .095"><a-image src="./assets/upper-arm-flex.svg" position=".10 0 0" width=".28" height=".20" material="transparent:true;shader:flat"></a-image><a-image src="./assets/forearm-flex.svg" position=".28 -.02 0" width=".27" height=".19" material="transparent:true;shader:flat"></a-image><a-image src="./assets/hand-open.svg" position=".43 -.05 0" width=".18" height=".18" material="transparent:true;shader:flat"></a-entity>
<a-entity id="legL" position="-.105 -.78 .085"><a-image src="./assets/thigh-flex.svg" position="0 -.12 0" width=".18" height=".28" material="transparent:true;shader:flat"></a-image><a-image src="./assets/shin-flex.svg" position="-.01 -.34 0" width=".16" height=".25" material="transparent:true;shader:flat"></a-image><a-image src="./assets/shoe.svg" position="-.05 -.52 0" width=".26" height=".17" material="transparent:true;shader:flat"></a-image></a-entity>
<a-entity id="legR" position=".105 -.78 .085"><a-image src="./assets/thigh-flex.svg" position="0 -.12 0" width=".18" height=".28" material="transparent:true;shader:flat"></a-image><a-image src="./assets/shin-flex.svg" position=".01 -.34 0" width=".16" height=".25" material="transparent:true;shader:flat"></a-image><a-image src="./assets/shoe.svg" position=".05 -.52 0" width=".26" height=".17" material="transparent:true;shader:flat"></a-image></a-entity>
</a-entity></a-entity></a-scene>
<script>
const $=s=>document.querySelector(s),scene=$("#scene"),target=$("#target"),life=$("#life"),status=$("#status"),sound=$("#sound");let found=false,audio=null;
function cameraLayer(){const v=document.querySelector("video");if(v){v.style.position="fixed";v.style.left="0";v.style.top="0";v.style.width="100%";v.style.height="100%";v.style.objectFit="cover";v.style.zIndex="0";v.style.display="block"}const c=document.querySelector("a-scene canvas");if(c){c.style.position="fixed";c.style.left="0";c.style.top="0";c.style.width="100%";c.style.height="100%";c.style.zIndex="1";c.style.background="transparent"}}
scene.addEventListener("loaded",()=>setTimeout(cameraLayer,300));scene.addEventListener("arReady",()=>{cameraLayer();status.textContent="Apunta a la caja…"});
new MutationObserver(cameraLayer).observe(document.body,{childList:true,subtree:true});
target.addEventListener("targetFound",()=>{found=true;life.object3D.visible=true;status.textContent="✨ ¡La uva cobró vida!"});target.addEventListener("targetLost",()=>{found=false;life.object3D.visible=false;status.textContent="Apunta nuevamente a la caja…"});
sound.onclick=()=>{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();sound.textContent="🔊 Música activada";const notes=[392,440,523,587,659,587,523,440];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.15;o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.14)})};
</script>
</body>
</html>
