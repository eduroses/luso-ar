<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROSÉS — Jugo de Uva | Realidad Aumentada</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16051f;font-family:Arial,sans-serif}#ui{position:fixed;z-index:20;top:0;left:0;right:0;padding:16px;text-align:center;color:#fff;background:linear-gradient(#16051fee,transparent);pointer-events:none;text-shadow:0 2px 8px #000}#ui h1{margin:0 0 5px;font-size:24px}#ui p{margin:0;font-size:14px}#music{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:12px 16px;background:#fff;color:#5a1a8a;font-weight:800;box-shadow:0 4px 18px #0006}#music.ready{animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.06)}}.status{position:fixed;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);background:#111d;color:#fff;border-radius:999px;padding:10px 16px;white-space:nowrap;box-shadow:0 4px 16px #0005}</style></head><body>
<div id="ui"><h1>🍇 ROSÉS — Jugo de Uva</h1><p>Apuntá la cámara a la cara de la caja.</p></div><button id="music" class="ready">🎵 Activar canción</button><div class="status" id="status">Buscando la caja…</div>
<audio id="jingle" preload="auto" src="data:audio/wav;base64,PLACEHOLDER_AUDIO"></audio>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading:no; uiError:no; uiScanning:no" color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded><a-light type="ambient" intensity="1.8"></a-light><a-light type="directional" intensity="1.4" position="-1 2 2"></a-light><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex:0"><a-entity id="character" position="0 0 0.10" scale="0.48 0.48 0.48" visible="false" gltf-model="data:model/gltf-binary;base64,PLACEHOLDER_GLB"></a-entity></a-entity></a-scene>
<script>const target=document.querySelector('#target'),char=document.querySelector('#character'),status=document.querySelector('#status'),btn=document.querySelector('#music'),jingle=document.querySelector('#jingle');let parts={},dancing=false,start=0;char.addEventListener('model-loaded',()=>{const root=char.object3D;['Arm_L','Arm_R','Leg_L','Leg_R','Hand_L','Hand_R','Shoe_L','Shoe_R'].forEach(n=>parts[n]=root.getObjectByName(n));});function pose(n,x,y,z){if(parts[n])parts[n].rotation.set(x,y,z)}function resetPose(){Object.values(parts).forEach(o=>o&&o.rotation.set(0,0,0));}function dance(t){if(!dancing)return;const s=(t-start)/1000,b=Math.sin(s*7.4);char.object3D.position.y=.03+Math.abs(Math.sin(s*3.7))*.045;char.object3D.rotation.z=Math.sin(s*3.7)*.045;pose('Arm_L',0,0,-.25-.65*Math.max(0,b));pose('Arm_R',0,0,.25+.65*Math.max(0,-b));pose('Leg_L',0,0,.13*Math.sin(s*7.4));pose('Leg_R',0,0,-.13*Math.sin(s*7.4));pose('Hand_L',.16*Math.sin(s*10),0,.18*Math.sin(s*14));pose('Hand_R',-.16*Math.sin(s*10),0,-.18*Math.sin(s*14));requestAnimationFrame(dance);}function startDance(){dancing=true;start=performance.now();requestAnimationFrame(dance);}function stopDance(){dancing=false;char.object3D.position.y=0;char.object3D.rotation.set(0,0,0);resetPose();}function playSong(){jingle.currentTime=0;const p=jingle.play();if(p)p.catch(()=>{});if('speechSynthesis'in window){speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance('Jugo de uva, jugo de uva… ¡qué rico!');u.lang='es-UY';u.rate=.9;u.pitch=1.15;u.volume=.95;speechSynthesis.speak(u);},500);}}btn.addEventListener('click',()=>{playSong();btn.classList.remove('ready');btn.textContent='🎵 Jugo de Uva';if(target.object3D.visible)startDance();});target.addEventListener('targetFound',()=>{status.textContent='🎉 ¡ROSÉS cobró vida!';char.setAttribute('visible',true);char.setAttribute('animation__appear','property:scale;from:.02 .02 .02;to:.48 .48 .48;dur:800;easing:easeOutElastic');setTimeout(startDance,800);});target.addEventListener('targetLost',()=>{status.textContent='Apuntá nuevamente a la caja…';stopDance();char.setAttribute('visible',false);char.setAttribute('scale','.48 .48 .48');});</script></body></html>
