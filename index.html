<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROSÉS — Jugo de Uva AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12081c;font-family:Arial,sans-serif}#ui{position:fixed;z-index:20;top:0;left:0;right:0;text-align:center;color:#fff;padding:14px;text-shadow:0 2px 10px #000;background:linear-gradient(#000c,transparent)}#ui b{font-size:25px}.pill{position:fixed;z-index:30;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#111d;padding:10px 17px;border-radius:99px;white-space:nowrap;box-shadow:0 4px 18px #0005}.btn{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:11px 15px;font-weight:800;color:#5b1a86;background:#fff;box-shadow:0 4px 16px #0005}</style></head><body>
<div id="ui"><b>🍇 ROSÉS</b></div><button class="btn" id="sound">🎵 Activar canción</button><div class="pill" id="status">Apunta a la caja…</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind;uiLoading:no;uiError:no;uiScanning:no" renderer="colorManagement:true;physicallyCorrectLights:true;antialias:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded>
<a-light type="ambient" intensity="1.7"></a-light><a-light type="directional" intensity="1.8" position="-1 2 2"></a-light><a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0"><a-entity id="mascot" position="-0.05 -0.16 0.06"></a-entity></a-entity></a-scene>
<script>
const target=document.querySelector('#target'), mascot=document.querySelector('#mascot'), status=document.querySelector('#status'), sound=document.querySelector('#sound');
let found=false, dancing=false, audio=null, built=false; const E={};
function el(tag,id,attrs={}){const o=document.createElement(tag);o.id=id;for(const[k,v]of Object.entries(attrs))o.setAttribute(k,v);mascot.appendChild(o);E[id]=o;return o;}
function arm(side){const s=side==='L'?-1:1;el('a-cylinder','upperArm'+side,{position:`${0.18*s} 0.02 0.02`,rotation:`0 0 ${-28*s}`,height:.30,radius:.075,color:'#70207f',segments:32});el('a-sphere','elbow'+side,{position:`${0.30*s} -0.09 0.025`,radius:.09,color:'#8c3299'});el('a-cylinder','forearm'+side,{position:`${0.39*s} -0.22 0.03`,rotation:`0 0 ${-18*s}`,height:.27,radius:.068,color:'#70207f',segments:32});el('a-sphere','hand'+side,{position:`${0.45*s} -0.34 0.04`,radius:.105,color:'#f4eee4'});for(let i=0;i<3;i++)el('a-sphere','finger'+side+i,{position:`${(0.45+0.045*i)*s} ${-0.43+0.05*i} 0.04`,radius:.032,color:'#f4eee4'});}
function leg(side){const s=side==='L'?-1:1;el('a-cylinder','thigh'+side,{position:`${0.10*s} -0.62 0.025`,height:.38,radius:.09,color:'#70207f',segments:32});el('a-sphere','knee'+side,{position:`${0.12*s} -0.83 0.03`,radius:.095,color:'#8c3299'});el('a-cylinder','shin'+side,{position:`${0.14*s} -1.05 0.035`,height:.42,radius:.075,color:'#70207f',segments:32});el('a-box','shoe'+side,{position:`${0.16*s} -1.30 0.06`,width:.34,height:.16,depth:.24,color:'#f0b914'});el('a-box','sole'+side,{position:`${0.16*s} -1.39 0.055`,width:.37,height:.06,depth:.27,color:'#2a202b'});}
function build(){if(built)return;built=true;arm('L');arm('R');leg('L');leg('R');for(const k in E){E[k].object3D.visible=false;E[k].object3D.scale.set(.02,.02,.02)}}
function showGroup(prefix,delay){setTimeout(()=>Object.keys(E).filter(k=>k.startsWith(prefix)).forEach(k=>pop(E[k])),delay)}
function pop(o){o.object3D.visible=true;const t0=performance.now();function f(t){const k=Math.min(1,(t-t0)/380),e=1-Math.pow(1-k,3);o.object3D.scale.set(e,e,e);if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function transform(){build();showGroup('upperArm',350);showGroup('elbow',500);showGroup('forearm',650);showGroup('hand',800);showGroup('finger',900);showGroup('thigh',1150);showGroup('knee',1300);showGroup('shin',1450);showGroup('shoe',1650);showGroup('sole',1700);setTimeout(startDance,2150)}
function startDance(){if(dancing)return;dancing=true;const t0=performance.now();function loop(t){if(!dancing)return;const q=(t-t0)/1000;mascot.object3D.rotation.z=Math.sin(q*5.5)*.035;mascot.object3D.position.y=-.16+Math.abs(Math.sin(q*5.5))*.025;for(const[n,a]of [['upperArmL',-1],['upperArmR',1],['forearmL',1],['forearmR',-1],['thighL',1],['thighR',-1],['shinL',-1],['shinR',1]])if(E[n])E[n].object3D.rotation.z=Math.sin(q*5.5+a)*.18;requestAnimationFrame(loop)}requestAnimationFrame(loop)}
function stop(){dancing=false;mascot.object3D.rotation.z=0;mascot.object3D.position.y=-.16}
function voice(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('¡Jugo de uva! ¡Jugo de uva!');u.lang='es-UY';u.rate=.9;u.pitch=1.12;u.volume=1;speechSynthesis.speak(u)}
target.addEventListener('targetFound',()=>{found=true;status.textContent='✨ ¡La caja cobró vida!';transform();if(sound.dataset.on==='1')voice()});target.addEventListener('targetLost',()=>{found=false;stop();status.textContent='Apunta nuevamente a la caja…'});
sound.onclick=()=>{sound.dataset.on='1';sound.textContent='🎵 Canción activada';audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=[392,440,523,587,659,587,523,440,392,523,587,659],st=audio.currentTime;notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,st+i*.16);g.gain.exponentialRampToValueAtTime(.075,st+i*.16+.02);g.gain.exponentialRampToValueAtTime(.0001,st+i*.16+.14);o.connect(g).connect(audio.destination);o.start(st+i*.16);o.stop(st+i*.16+.15)});voice();if(found)startDance()};
</script></body></html>
