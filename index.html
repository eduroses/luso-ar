<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROSÉS — Jugo de Uva AR</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><script src="./character-data.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160b24;font-family:Arial,sans-serif}#ui{position:fixed;z-index:20;top:0;left:0;right:0;text-align:center;color:white;padding:14px;text-shadow:0 2px 8px #000;background:linear-gradient(#000b,transparent)}#ui b{font-size:24px}#ui small{display:block;margin-top:4px}#sound{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:11px 15px;font-weight:800;color:#5b1a86;background:#fff}.scan{position:fixed;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);color:white;background:#111c;padding:9px 15px;border-radius:99px}</style></head><body><div id="ui"><b>🍇 ROSÉS</b><small>Jugo de Uva cobra vida</small></div><button id="sound">🎵 Activar canción</button><div class="scan" id="status">Buscando la caja…</div><a-scene mindar-image="imageTargetSrc: ./targets.mind;uiLoading:no;uiError:no;uiScanning:no" renderer="colorManagement:true;physicallyCorrectLights:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded><a-light type="ambient" intensity="1.7"></a-light><a-light type="directional" intensity="1.4" position="-1 2 2"></a-light><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex:0"><a-entity id="character" position="0 0 0.05" scale="0.78 0.78 0.78"></a-entity><a-entity position="0 1.78 0.18"><a-text value="ROSÉS" align="center" width="1.4" color="#ffffff"></a-text></a-entity><a-entity position="0 1.45 0.19"><a-text value="Jugo de Uva" align="center" width="1.65" color="#ffe600"></a-text></a-entity></a-entity></a-scene><script>
const target=document.querySelector('#target'),char=document.querySelector('#character'),status=document.querySelector('#status'),sound=document.querySelector('#sound');let found=false,audio=null,dancing=false;
async function loadModel(){try{const raw=atob(window.CHARACTER_GLB_GZIP_B64),u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);let bytes;if('DecompressionStream' in window){bytes=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}else{throw new Error('El navegador no admite descompresión gzip')}const blob=new Blob([bytes],{type:'model/gltf-binary'});const url=URL.createObjectURL(blob);char.setAttribute('gltf-model',url);}catch(e){status.textContent='No se pudo cargar el personaje 3D';console.error(e)}}
function node(n){return char.object3D.getObjectByName(n)}
function hideParts(){['GRAPE_FACE','LEAF','EYE_L','EYE_R','IRIS_L','IRIS_R','PUPIL_L','PUPIL_R','SHINE_L','SHINE_R','MOUTH','TONGUE','ARM_L','ARM_R','HAND_L','HAND_R','LEG_L','LEG_R','SHOE_L','SHOE_R','TOE_L','TOE_R'].forEach(n=>{const o=node(n);if(o)o.visible=false})}
function pop(n,delay){setTimeout(()=>{const o=node(n);if(!o)return;o.visible=true;o.scale.set(.01,.01,.01);const s=performance.now();(function f(t){const k=Math.min(1,(t-s)/360),e=1-Math.pow(1-k,3);o.scale.set(e,e,e);if(k<1)requestAnimationFrame(f)})(s)},delay)}
function transform(){hideParts();pop('EYE_L',500);pop('EYE_R',500);pop('IRIS_L',650);pop('IRIS_R',650);pop('PUPIL_L',760);pop('PUPIL_R',760);pop('SHINE_L',850);pop('SHINE_R',850);pop('MOUTH',1050);pop('TONGUE',1150);pop('GRAPE_FACE',1200);pop('LEAF',1250);pop('ARM_L',1450);pop('ARM_R',1550);pop('HAND_L',1750);pop('HAND_R',1850);pop('LEG_L',2150);pop('LEG_R',2250);pop('SHOE_L',2450);pop('SHOE_R',2550);pop('TOE_L',2650);pop('TOE_R',2750);setTimeout(()=>startDance(),3200)}
function startDance(){if(dancing)return;dancing=true;const t0=performance.now();function loop(t){if(!dancing)return;const q=(t-t0)/1000;const root=char.object3D;root.rotation.z=Math.sin(q*6)*.055;root.position.y=.02+Math.abs(Math.sin(q*6))*.035;for(const [n,a] of [['ARM_L',-1],['ARM_R',1],['LEG_L',1],['LEG_R',-1]]){const o=node(n);if(o)o.rotation.z=Math.sin(q*6+a)*.35}const m=node('MOUTH');if(m)m.scale.y=1+Math.abs(Math.sin(q*9))*.5;requestAnimationFrame(loop)}requestAnimationFrame(loop)}
function stopDance(){dancing=false}
target.addEventListener('targetFound',()=>{found=true;status.textContent='✨ ¡ROSÉS cobró vida!';transform();if(sound.dataset.on==='1')playVoice()});target.addEventListener('targetLost',()=>{found=false;stopDance();status.textContent='Apunta nuevamente a la caja…'});
function playVoice(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('¡Jugo de uva! ¡Jugo de uva!');u.lang='es-UY';u.rate=.95;u.pitch=1.15;u.volume=1;speechSynthesis.speak(u)}
sound.onclick=()=>{sound.dataset.on='1';sound.textContent='🎵 Canción activada';if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=[392,440,523,587,659,587,523,440,392];const st=audio.currentTime;notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,st+i*.18);g.gain.exponentialRampToValueAtTime(.08,st+i*.18+.02);g.gain.exponentialRampToValueAtTime(.0001,st+i*.18+.16);o.connect(g).connect(audio.destination);o.start(st+i*.18);o.stop(st+i*.18+.17)});playVoice();if(found)startDance()};
loadModel();</script></body></html>
