<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROSÉS — Jugo de Uva AR</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial}#ui{position:fixed;z-index:20;top:0;left:0;right:0;text-align:center;color:#fff;padding:14px;text-shadow:0 2px 10px #000;background:linear-gradient(#000b,transparent)}#ui b{font-size:23px}.pill{position:fixed;z-index:30;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#111c;padding:10px 17px;border-radius:99px;white-space:nowrap}.btn{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:11px 15px;font-weight:800;color:#5b1a86;background:#fff}</style></head><body><div id="ui"><b>🍇 ROSÉS — Jugo de Uva</b></div><button class="btn" id="sound">🎵 Activar música</button><div class="pill" id="status">Apunta a la caja…</div><a-scene mindar-image="imageTargetSrc:./targets.mind;uiLoading:no;uiError:no;uiScanning:no;filterMinCF:.0001;filterBeta:.001" renderer="alpha:true;colorManagement:true;antialias:true;precision:high" background="color:transparent" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded><a-light type="ambient" intensity="1.8"></a-light><a-camera look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex:0"><a-entity id="life"><a-image id="grape" src="./assets/grape.webp" position="-.01 -.53 .11" width=".42" height=".55" material="transparent:true;shader:flat;side:double"></a-image><a-entity id="armL" position="-.245 -.52 .095"><a-image id="upperL" src="./assets/upper-arm-flex.svg" position="-.10 0 0" width=".28" height=".20" material="transparent:true;shader:flat"></a-image><a-image id="foreL" src="./assets/forearm-flex.svg" position="-.28 -.02 0" width=".27" height=".19" material="transparent:true;shader:flat"></a-image><a-image id="handL" src="./assets/hand-open.svg" position="-.43 -.05 0" width=".18" height=".18" material="transparent:true;shader:flat"></a-image></a-entity><a-entity id="armR" position=".245 -.52 .095" scale="-1 1 1"><a-image id="upperR" src="./assets/upper-arm-flex.svg" position="-.10 0 0" width=".28" height=".20" material="transparent:true;shader:flat"></a-image><a-image id="foreR" src="./assets/forearm-flex.svg" position="-.28 -.02 0" width=".27" height=".19" material="transparent:true;shader:flat"></a-image><a-image id="handR" src="./assets/hand-open.svg" position="-.43 -.05 0" width=".18" height=".18" material="transparent:true;shader:flat"></a-image></a-entity><a-entity id="legL" position="-.105 -.78 .085"><a-image id="thighL" src="./assets/thigh-flex.svg" position="0 -.12 0" width=".18" height=".28" material="transparent:true;shader:flat"></a-image><a-image id="shinL" src="./assets/shin-flex.svg" position="-.01 -.34 0" width=".16" height=".25" material="transparent:true;shader:flat"></a-image><a-image id="shoeL" src="./assets/shoe.svg" position="-.05 -.52 0" width=".26" height=".17" material="transparent:true;shader:flat"></a-image></a-entity><a-entity id="legR" position=".105 -.78 .085" scale="-1 1 1"><a-image id="thighR" src="./assets/thigh-flex.svg" position="0 -.12 0" width=".18" height=".28" material="transparent:true;shader:flat"></a-image><a-image id="shinR" src="./assets/shin-flex.svg" position="-.01 -.34 0" width=".16" height=".25" material="transparent:true;shader:flat"></a-image><a-image id="shoeR" src="./assets/shoe.svg" position="-.05 -.52 0" width=".26" height=".17" material="transparent:true;shader:flat"></a-image></a-entity></a-entity></a-entity></a-scene><script>const q=s=>document.querySelector(s),target=q('#target'),life=q('#life'),grape=q('#grape'),status=q('#status'),sound=q('#sound'),armL=q('#armL'),armR=q('#armR'),legL=q('#legL'),legR=q('#legR'),uL=q('#upperL'),fL=q('#foreL'),hL=q('#handL'),uR=q('#upperR'),fR=q('#foreR'),hR=q('#handR'),tL=q('#thighL'),sL=q('#shinL'),shL=q('#shoeL'),tR=q('#thighR'),sR=q('#shinR'),shR=q('#shoeR');const parts=[grape,armL,armR,legL,legR];let found=false,active=false,audio=null;function reset(){parts.forEach(x=>{x.object3D.visible=false;x.object3D.scale.set(.05,.05,.05)});life.object3D.position.set(0,0,0);life.object3D.rotation.set(0,0,0)}function pop(x,d){setTimeout(()=>{x.object3D.visible=true;let st=performance.now();function a(n){let k=Math.min(1,(n-st)/520),e=1-Math.pow(1-k,3),w=Math.sin(k*Math.PI)*.1;x.object3D.scale.set(.05+.95*e,.05+.95*e+w,.05+.95*e);if(k<1)requestAnimationFrame(a)}requestAnimationFrame(a)},d)}function setR(x,z,px=0,py=0){x.object3D.rotation.z=z;x.object3D.position.x=px;x.object3D.position.y=py}function wake(){active=false;reset();pop(grape,80);pop(armL,600);pop(armR,760);pop(legL,1040);pop(legR,1180);setTimeout(()=>{life.object3D.position.y=.035;setTimeout(()=>life.object3D.position.y=0,180)},1550);setTimeout(()=>found&&dance(),1800)}function dance(){if(!found)return;active=true;let st=performance.now();function loop(n){if(!active||!found)return;let t=(n-st)/1000,p=t%12,a=Math.sin(t*4.8),b=Math.sin(t*2.4),c=Math.sin(t*7.1);life.object3D.position.y=.012+Math.abs(Math.sin(t*4.7))*.018+Math.sin(t*2.3)*.006;life.object3D.rotation.z=Math.sin(t*1.9)*.035+Math.sin(t*4.1)*.012;grape.object3D.rotation.z=Math.sin(t*2.8)*.055+Math.sin(t*6.1)*.018;if(p<3){setR(armL,-.22+a*.34);setR(armR,.22-Math.sin(t*5.4+.9)*.34);setR(fL,a*.18);setR(fR,-a*.15);setR(hL,a*.25);setR(hR,-a*.22);setR(legL,.04-a*.1);setR(legR,-.04+a*.1)}else if(p<6){setR(armL,-.12+Math.sin(t*3.1)*.48);setR(armR,.18-Math.sin(t*3.1)*.32);setR(fL,a*.28+c*.08);setR(fR,-a*.2);setR(hL,a*.45);setR(hR,-a*.3);setR(legL,.08+b*.1,-.008+a*.018);setR(legR,-.14-b*.08,.008-a*.018)}else if(p<9){setR(armL,.1+Math.sin(t*2.2)*.55);setR(armR,-.1-Math.sin(t*2.2)*.55);setR(fL,.18+b*.22);setR(fR,-.18-b*.22);setR(hL,.25+a*.3);setR(hR,-.25-a*.3);setR(legL,-.12-c*.16,.012+a*.028);setR(legR,.12+c*.16,-.012-a*.028)}else{setR(armL,-.35+a*.58);setR(armR,.35-a*.58);setR(fL,.25-a*.3);setR(fR,-.25+a*.3);setR(hL,a*.55);setR(hR,-a*.55);setR(legL,.16+b*.2);setR(legR,-.16-b*.2)}uL.object3D.rotation.z*=.55;uR.object3D.rotation.z*=.55;fL.object3D.rotation.z+=Math.sin(t*8.1)*.025;fR.object3D.rotation.z-=Math.sin(t*7.6)*.025;tL.object3D.rotation.z=Math.sin(t*3.2+.5)*.12;tR.object3D.rotation.z=-Math.sin(t*3.2+.7)*.12;sL.object3D.rotation.z=-Math.sin(t*4.2+.8)*.16;sR.object3D.rotation.z=Math.sin(t*4+1.1)*.16;shL.object3D.rotation.z=Math.sin(t*4.2+1)*.1;shR.object3D.rotation.z=-Math.sin(t*4+.7)*.1;requestAnimationFrame(loop)}requestAnimationFrame(loop)}function stop(){active=false;parts.forEach(x=>x.object3D.rotation.set(0,0,0));life.object3D.position.set(0,0,0);life.object3D.rotation.set(0,0,0)}target.addEventListener('targetFound',()=>{found=true;status.textContent='✨ ¡La uva cobró vida!';wake();if(sound.dataset.on==='1')play()});target.addEventListener('targetLost',()=>{found=false;stop();status.textContent='Apunta nuevamente a la caja…'});function play(){audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let now=audio.currentTime,mel=[392,440,523,587,659,587,523,440,392,523,587,659,784,659,587,523];mel.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),tt=now+i*.15;o.type=i%4?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.045,tt+.02);g.gain.exponentialRampToValueAtTime(.0001,tt+.125);o.connect(g).connect(audio.destination);o.start(tt);o.stop(tt+.14)})}sound.onclick=()=>{sound.dataset.on='1';sound.textContent='🔊 Música activada';audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();play();if(found)dance()};reset();</script></body></html>
