<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROSÉS — Jugo de Uva AR</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12081c;font-family:Arial,sans-serif}#ui{position:fixed;z-index:20;top:0;left:0;right:0;text-align:center;color:#fff;padding:14px;text-shadow:0 2px 10px #000;background:linear-gradient(#000c,transparent)}#ui b{font-size:25px}.pill{position:fixed;z-index:30;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#111d;padding:10px 17px;border-radius:99px;white-space:nowrap;box-shadow:0 4px 18px #0005}.btn{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:11px 15px;font-weight:800;color:#5b1a86;background:#fff;box-shadow:0 4px 16px #0005}</style></head><body><div id="ui"><b>🍇 ROSÉS</b></div><button class="btn" id="sound">🎵 Activar música</button><div class="pill" id="status">Apunta a la caja…</div><a-scene mindar-image="imageTargetSrc: ./targets.mind;uiLoading:no;uiError:no;uiScanning:no" renderer="colorManagement:true;physicallyCorrectLights:true;antialias:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded><a-light type="ambient" intensity="1.8"></a-light><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex:0"><a-entity id="life" position="0 0 0"><a-image id="grape" src="./assets/grape.webp" position="-0.01 -0.53 0.10" width="0.42" height="0.55" material="transparent:true;shader:flat;side:double"></a-image><a-image id="armL" src="./assets/arm-left.svg" position="-0.29 -0.54 0.08" width="0.52" height="0.52" material="transparent:true;shader:flat;side:double"></a-image><a-image id="armR" src="./assets/arm-right.svg" position="0.29 -0.54 0.08" width="0.52" height="0.52" material="transparent:true;shader:flat;side:double"></a-image><a-image id="legL" src="./assets/leg-left.svg" position="-0.10 -0.94 0.075" width="0.31" height="0.45" material="transparent:true;shader:flat;side:double"></a-image><a-image id="legR" src="./assets/leg-right.svg" position="0.10 -0.94 0.075" width="0.31" height="0.45" material="transparent:true;shader:flat;side:double"></a-image></a-entity></a-entity></a-scene><script>
const target=document.querySelector('#target'),life=document.querySelector('#life'),grape=document.querySelector('#grape'),armL=document.querySelector('#armL'),armR=document.querySelector('#armR'),legL=document.querySelector('#legL'),legR=document.querySelector('#legR'),status=document.querySelector('#status'),sound=document.querySelector('#sound');let found=false,active=false,audio=null;
const parts=[grape,armL,armR,legL,legR];
function reset(){active=false;parts.forEach(p=>{p.object3D.visible=false;p.object3D.scale.set(.02,.02,.02)});life.object3D.position.y=0;life.object3D.rotation.z=0}
function pop(p,delay,base){setTimeout(()=>{p.object3D.visible=true;const t=performance.now();function f(now){const k=Math.min(1,(now-t)/420),e=1-Math.pow(1-k,3);p.object3D.scale.set(base*(.02+.98*e),base*(.02+.98*e),base*(.02+.98*e));if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)},delay)}
function transform(){active=true;reset();pop(grape,80,1);pop(armL,620,1);pop(armR,780,1);pop(legL,1030,1);pop(legR,1150,1);setTimeout(()=>{life.object3D.position.y=.045;setTimeout(()=>life.object3D.position.y=0,220)},1500);setTimeout(dance,1700)}
function dance(){if(!found)return;active=true;const t0=performance.now();function loop(t){if(!active||!found)return;const q=(t-t0)/1000,beat=Math.sin(q*7.2),slow=Math.sin(q*3.6);life.object3D.position.y=Math.abs(beat)*.028;life.object3D.rotation.z=slow*.025;grape.object3D.rotation.z=Math.sin(q*3.6)*.07;armL.object3D.rotation.z=-.16+Math.sin(q*7.2)*.28;armR.object3D.rotation.z=.16-Math.sin(q*7.2)*.28;legL.object3D.rotation.z=.08-Math.sin(q*7.2)*.12;legR.object3D.rotation.z=-.08+Math.sin(q*7.2)*.12;legL.object3D.position.x=-.10+Math.sin(q*7.2)*.025;legR.object3D.position.x=.10-Math.sin(q*7.2)*.025;requestAnimationFrame(loop)}requestAnimationFrame(loop)}
function stop(){active=false;life.object3D.position.y=0;life.object3D.rotation.z=0;parts.forEach(p=>p.object3D.rotation.z=0)}
target.addEventListener('targetFound',()=>{found=true;status.textContent='✨ ¡La uva cobró vida!';transform();if(sound.dataset.on==='1')playJingle()});target.addEventListener('targetLost',()=>{found=false;stop();status.textContent='Apunta nuevamente a la caja…'});
function playJingle(){audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=[392,440,523,587,659,587,523,440,392,523,587,659,784,659,587,523],st=audio.currentTime;notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f,st+i*.15);g.gain.setValueAtTime(.0001,st+i*.15);g.gain.exponentialRampToValueAtTime(.055,st+i*.15+.018);g.gain.exponentialRampToValueAtTime(.0001,st+i*.15+.12);o.connect(g).connect(audio.destination);o.start(st+i*.15);o.stop(st+i*.15+.13)});[0,4,8,12].forEach(i=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=130;g.gain.setValueAtTime(.0001,st+i*.15);g.gain.exponentialRampToValueAtTime(.12,st+i*.15+.01);g.gain.exponentialRampToValueAtTime(.0001,st+i*.15+.09);o.connect(g).connect(audio.destination);o.start(st+i*.15);o.stop(st+i*.15+.1)})}
sound.onclick=()=>{sound.dataset.on='1';sound.textContent='🔊 Música activada';if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();playJingle();if(found)dance()};reset();</script></body></html>
