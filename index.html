<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROSÉS — Jugo de Uva | Realidad Aumentada</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16051f;font-family:Arial,sans-serif}
#ui{position:fixed;z-index:20;top:0;left:0;right:0;padding:16px;text-align:center;color:#fff;background:linear-gradient(#16051fee,transparent);pointer-events:none;text-shadow:0 2px 8px #000}
#ui h1{margin:0 0 5px;font-size:24px}#ui p{margin:0;font-size:14px}
#music{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:12px 16px;background:#fff;color:#5a1a8a;font-weight:800;box-shadow:0 4px 18px #0006}
#music.ready{animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
.status{position:fixed;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);background:#111d;color:#fff;border-radius:999px;padding:10px 16px;white-space:nowrap;box-shadow:0 4px 16px #0005}
</style></head><body>
<div id="ui"><h1>🍇 ROSÉS — Jugo de Uva</h1><p>Apuntá la cámara a la cara de la caja.</p></div>
<button id="music" class="ready">🎵 Activar canción</button><div class="status" id="status">Buscando la caja…</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading:no; uiError:no; uiScanning:no" color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded>
<a-light type="ambient" intensity="1.8"></a-light><a-light type="directional" intensity="1.5" position="-1 2 2"></a-light><a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0">
<a-entity id="character" position="0 0 .10" scale=".55 .55 .55" visible="false">
  <a-box id="body" position="0 .62 0" width="1.18" height="1.65" depth=".44" color="#63139a"></a-box>
  <a-box position="0 .62 .225" width="1.10" height="1.55" depth=".025" color="#7b2db1"></a-box>
  <a-text value="ROSÉS" align="center" position="0 1.20 .255" width="1.65" color="#ffffff"></a-text>
  <a-text value="Jugo de Uva" align="center" position="0 .91 .255" width="1.55" color="#ffe400"></a-text>
  <a-text value="SIN ALCOHOL" align="center" position="0 .16 .255" width="1.05" color="#ffffff"></a-text>
  <a-cylinder position="0 1.53 0" radius=".29" height=".18" color="#eeeeee"></a-cylinder>
  <!-- Cara 3D inspirada directamente en la uva del envase -->
  <a-sphere position="0 .60 .27" radius=".34" color="#5a1586" scale="1 .92 .72"></a-sphere>
  <a-sphere position="-.12 .68 .49" radius=".105" color="#ffe500" scale="1 .62 1"></a-sphere>
  <a-sphere position=".12 .68 .49" radius=".105" color="#ffe500" scale="1 .62 1"></a-sphere>
  <a-sphere position="-.12 .68 .555" radius=".052" color="#159bd2"></a-sphere>
  <a-sphere position=".12 .68 .555" radius=".052" color="#159bd2"></a-sphere>
  <a-sphere position="-.105 .69 .592" radius=".023" color="#111"></a-sphere>
  <a-sphere position=".135 .69 .592" radius=".023" color="#111"></a-sphere>
  <a-sphere position="-.13 .69 .62" radius=".012" color="#fff"></a-sphere>
  <a-sphere position=".11 .69 .62" radius=".012" color="#fff"></a-sphere>
  <a-cylinder position="-.12 .80 .50" radius=".018" height=".17" rotation="0 0 90" color="#1d0b25"></a-cylinder>
  <a-cylinder position=".12 .80 .50" radius=".018" height=".17" rotation="0 0 90" color="#1d0b25"></a-cylinder>
  <a-box position="0 .51 .52" width=".28" height=".055" depth=".035" color="#120d18"></a-box>
  <a-sphere position="0 .50 .55" radius=".075" color="#f23f99" scale="1 .45 .55"></a-sphere>
  <!-- Brazos y manos -->
  <a-entity id="armL" position="-.76 .69 0"><a-cylinder radius=".075" height=".52" color="#63139a" rotation="0 0 62"></a-cylinder><a-sphere id="handL" position="-.23 -.18 .02" radius=".12" color="#7a27a8"></a-sphere><a-sphere position="-.31 -.20 .04" radius=".035" color="#7a27a8"></a-sphere><a-sphere position="-.28 -.24 .04" radius=".035" color="#7a27a8"></a-sphere><a-sphere position="-.24 -.27 .04" radius=".035" color="#7a27a8"></a-sphere></a-entity>
  <a-entity id="armR" position=".76 .69 0"><a-cylinder radius=".075" height=".52" color="#63139a" rotation="0 0 -62"></a-cylinder><a-sphere id="handR" position=".23 -.18 .02" radius=".12" color="#7a27a8"></a-sphere><a-sphere position=".31 -.20 .04" radius=".035" color="#7a27a8"></a-sphere><a-sphere position=".28 -.24 .04" radius=".035" color="#7a27a8"></a-sphere><a-sphere position=".24 -.27 .04" radius=".035" color="#7a27a8"></a-sphere></a-entity>
  <!-- Piernas y zapatos -->
  <a-entity id="legL" position="-.25 -.28 0"><a-cylinder radius=".09" height=".48" color="#63139a"></a-cylinder><a-box position="0 -.27 .10" width=".35" height=".17" depth=".52" color="#ffe400"></a-box></a-entity>
  <a-entity id="legR" position=".25 -.28 0"><a-cylinder radius=".09" height=".48" color="#63139a"></a-cylinder><a-box position="0 -.27 .10" width=".35" height=".17" depth=".52" color="#ffe400"></a-box></a-entity>
  <!-- Racimo superior -->
  <a-sphere position="-.20 1.73 .02" radius=".08" color="#4d116e"></a-sphere><a-sphere position="-.10 1.78 .02" radius=".08" color="#4d116e"></a-sphere><a-sphere position="0 1.75 .02" radius=".08" color="#4d116e"></a-sphere><a-sphere position=".10 1.78 .02" radius=".08" color="#4d116e"></a-sphere><a-sphere position=".20 1.73 .02" radius=".08" color="#4d116e"></a-sphere>
  <a-sphere position="0 1.88 .02" radius=".11" color="#187a2d" scale="1.5 .45 .12"></a-sphere>
</a-entity></a-entity></a-scene>
<script>
const target=document.querySelector('#target'),char=document.querySelector('#character'),status=document.querySelector('#status'),btn=document.querySelector('#music');let audio=null,dancing=false,start=0;
function initAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function note(f,t,d=.22,g=.06){const o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(audio.destination);o.start(t);o.stop(t+d+.02)}
function song(){initAudio();const now=audio.currentTime+.05;[392,440,523,440,392,440,523,587,523,440,523,587,659,587,523,440,523,587,659].forEach((f,i)=>note(f,now+i*.22,.19,.07));if('speechSynthesis'in window){speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance('Jugo de uva, jugo de uva… ¡qué rico!');u.lang='es-UY';u.rate=.88;u.pitch=1.18;u.volume=1;speechSynthesis.speak(u)},450)}}
function dance(t){if(!dancing)return;const s=(t-start)/1000,b=Math.sin(s*7);char.object3D.position.y=.035+Math.abs(Math.sin(s*3.5))*.05;char.object3D.rotation.z=Math.sin(s*3.5)*.05;document.querySelector('#armL').object3D.rotation.z=-.35-.65*Math.max(0,b);document.querySelector('#armR').object3D.rotation.z=.35+.65*Math.max(0,-b);document.querySelector('#legL').object3D.rotation.z=.13*Math.sin(s*7);document.querySelector('#legR').object3D.rotation.z=-.13*Math.sin(s*7);document.querySelector('#handL').object3D.rotation.z=.4*Math.sin(s*10);document.querySelector('#handR').object3D.rotation.z=-.4*Math.sin(s*10);requestAnimationFrame(dance)}
function startDance(){dancing=true;start=performance.now();requestAnimationFrame(dance)}function stopDance(){dancing=false;char.object3D.position.y=0;char.object3D.rotation.z=0;['armL','armR','legL','legR','handL','handR'].forEach(id=>document.querySelector('#'+id).object3D.rotation.set(0,0,0))}
btn.onclick=()=>{song();btn.classList.remove('ready');btn.textContent='🎵 Jugo de Uva';if(target.object3D.visible)startDance()};target.addEventListener('targetFound',()=>{status.textContent='🎉 ¡ROSÉS cobró vida!';char.setAttribute('visible',true);char.setAttribute('animation__appear','property:scale;from:.02 .02 .02;to:.55 .55 .55;dur:850;easing:easeOutElastic');setTimeout(startDance,850)});target.addEventListener('targetLost',()=>{status.textContent='Apuntá nuevamente a la caja…';stopDance();char.setAttribute('visible',false);char.setAttribute('scale','.55 .55 .55')});
</script></body></html>
