or="#6b239c" rotation="0 0 65"></a-cylinder><a-sphere position="-.23 -.18 .02" radius=".095" color="#8a37b5"></a-sphere></a-entity><a-entity id="armR" position=".49 .72 0"><a-cylinder radius=".065" height=".44" color="#6b239c" rotation="0 0 -65"></a-cylinder><a-sphere position=".23 -.18 .02" radius=".095" color="#8a37b5"></a-sphere></a-entity><a-entity id="legL" position="-.21 .02 0"><a-cylinder radius=".075" height=".42" color="#6b239c"></a-cylinder><a-box position="0 -.24 .09" width=".30" height=".15" depth=".45" color="#ffe400"></a-box></a-entity><a-entity id="legR" position=".21 .02 0"><a-cylinder radius=".075" height=".42" color="#6b239c"></a-cylinder><a-box position="0 -.24 .09" width=".30" height=".15" depth=".45" color="#ffe400"></a-box></a-entity><a-sphere position="-.20 1.55 0" radius=".09" color="#52207f"></a-sphere><a-sphere position="-.10 1.61 0" radius=".09" color="#52207f"></a-sphere><a-sphere position="0 1.57 0" radius=".09" color="#52207f"></a-sphere><a-sphere position=".10 1.61 0" radius=".09" color="#52207f"></a-sphere><a-sphere position=".20 1.55 0" radius=".09" color="#52207f"></a-sphere></a-entity></a-entity></a-scene><script>const target=document.querySelector('#target'),char=document.querySelector('#character'),status=document.querySelector('#status'),btn=document.querySelector('#music');let audio=null,dancing=false,start=0;function initAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function note(f,t,d=.22,g=.06,type='triangle'){const o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(audio.destination);o.start(t);o.stop(t+d+.02)}function sing(){initAudio();const now=audio.currentTime+.05;[392,440,523,440,392,440,523,587,523,440,523,587,659,587,523,440].forEach((f,i)=>note(f,now+i*.25,.21,.075));setTimeout(()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Jugo de uva, jugo de uva… ¡qué rico!');u.lang='es-UY';u.rate=.9;u.pitch=1.2;u.volume=1;speechSynthesis.speak(u)}},600)}function danceLoop(t){if(!dancing)return;const s=(t-start)/1000,b=Math.sin(s*7);char.object3D.position.y=.04+Math.abs(Math.sin(s*3.5))*.06;char.object3D.rotation.z=Math.sin(s*3.5)*.06;document.querySelector('#armL').object3D.rotation.z=-.35-.65*Math.max(0,b);document.querySelector('#armR').object3D.rotation.z=.35+.65*Math.max(0,-b);document.querySelector('#legL').object3D.rotation.z=.14*Math.sin(s*7);document.querySelector('#legR').object3D.rotation.z=-.14*Math.sin(s*7);requestAnimationFrame(danceLoop)}function startDance(){dancing=true;start=performance.now();requestAnimationFrame(danceLoop)}function stopDance(){dancing=false;char.object3D.position.y=0;char.object3D.rotation.z=0;['armL','armR','legL','legR'].forEach(id=>document.querySelector('#'+id).object3D.rotation.set(0,0,0))}btn.onclick=()=>{sing();btn.classList.remove('ready');btn.textContent='🎵 Jingle activado';if(target.object3D.visible)startDance()};target.addEventListener('targetFound',()=>{status.textContent='🎉 ¡La caja cobró vida!';char.setAttribute('animation__appear','property:scale;from:.01 .01 .01;to:.70 .70 .70;dur:700;easing:easeOutElastic');setTimeout(startDance,700)});target.addEventListener('targetLost',()=>{status.textContent='Apuntá nuevamente a la caja…';stopDance();char.setAttribute('scale','.01 .01 .01')});</script></body></html>
