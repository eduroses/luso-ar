<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROSÉS — Jugo de Uva AR</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><script src="./character-data.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12081c;font-family:Arial,sans-serif}#ui{position:fixed;z-index:20;top:0;left:0;right:0;text-align:center;color:#fff;padding:14px;text-shadow:0 2px 10px #000;background:linear-gradient(#000c,transparent)}#ui b{font-size:25px}#ui small{display:block;margin-top:4px;font-size:14px}.pill{position:fixed;z-index:30;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#111d;padding:10px 17px;border-radius:99px;white-space:nowrap;box-shadow:0 4px 18px #0005}.btn{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:11px 15px;font-weight:800;color:#5b1a86;background:#fff;box-shadow:0 4px 16px #0005}</style></head><body><div id="ui"><b>🍇 ROSÉS</b><small>Jugo de Uva cobra vida</small></div><button class="btn" id="sound">🎵 Activar canción</button><div class="pill" id="status">Apunta a la caja…</div><a-scene mindar-image="imageTargetSrc: ./targets.mind;uiLoading:no;uiError:no;uiScanning:no" renderer="colorManagement:true;physicallyCorrectLights:true;antialias:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded><a-light type="ambient" intensity="1.9"></a-light><a-light type="directional" intensity="1.6" position="-1 2 2"></a-light><a-light type="point" intensity="0.7" position="0 0 1"></a-light><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex:0"><a-entity id="character" position="0 0 0.06" scale="0.82 0.82 0.82"></a-entity></a-entity></a-scene><script>
const target=document.querySelector('#target'),char=document.querySelector('#character'),status=document.querySelector('#status'),sound=document.querySelector('#sound');let found=false,dancing=false,audio=null;
async function loadModel(){try{const raw=atob(window.CHARACTER_GLB_GZIP_B64),u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('gzip no disponible');const bytes=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());const url=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'}));char.setAttribute('gltf-model',url);char.addEventListener('model-loaded',()=>{prepare();});}catch(e){status.textContent='No se pudo cargar el personaje';console.error(e)}}
function node(n){return char.object3D.getObjectByName(n)}
const parts={eyes:['eye-1','eye1','pupil-1','pupil1','brow-1','brow1'],mouth:['mouth','tongue'],arms:['arm-1','arm1','hand-1','hand1'],legs:['leg-1','leg1','shoe-1','shoe1'],grapes:['g0','g1','g2','g3','g4']};
function allParts(){return Object.values(parts).flat().map(node).filter(Boolean)}
function prepare(){allParts().forEach(o=>o.visible=false);const carton=node('carton'),cap=node('cap');if(carton)carton.visible=true;if(cap)cap.visible=true;}
function popList(names,delay){setTimeout(()=>{names.forEach(n=>{const o=node(n);if(!o)return;o.visible=true;o.scale.set(.02,.02,.02);const s=performance.now();(function f(t){const k=Math.min(1,(t-s)/380),e=1-Math.pow(1-k,3);o.scale.set(e,e,e);if(k<1)requestAnimationFrame(f)})(s)})},delay)}
function transform(){prepare();popList(parts.eyes,350);popList(['mouth'],900);popList(['tongue'],1020);popList(parts.arms,1250);popList(parts.legs,1900);popList(parts.grapes,2450);setTimeout(()=>{allParts().forEach(o=>o.visible=true);startDance()},3100)}
function startDance(){if(dancing)return;dancing=true;const t0=performance.now();function loop(t){if(!dancing)return;const q=(t-t0)/1000,root=char.object3D;root.rotation.z=Math.sin(q*5.5)*.045;root.position.y=.025+Math.abs(Math.sin(q*5.5))*.025;for(const [n,a]of [['arm-1',-1],['arm1',1],['leg-1',1],['leg1',-1]]){const o=node(n);if(o)o.rotation.z=Math.sin(q*5.5+a)*.28}const m=node('mouth');if(m)m.scale.y=1+Math.abs(Math.sin(q*8))*.25;requestAnimationFrame(loop)}requestAnimationFrame(loop)}
function stopDance(){dancing=false;char.object3D.rotation.z=0;char.object3D.position.y=.0}
function playVoice(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('¡Jugo de uva! ¡Jugo de uva!');u.lang='es-UY';u.rate=.92;u.pitch=1.12;u.volume=1;speechSynthesis.speak(u)}
target.addEventListener('targetFound',()=>{found=true;status.textContent='✨ ¡ROSÉS cobró vida!';transform();if(sound.dataset.on==='1')playVoice()});target.addEventListener('targetLost',()=>{found=false;stopDance();status.textContent='Apunta nuevamente a la caja…';});
sound.onclick=()=>{sound.dataset.on='1';sound.textContent='🎵 Canción activada';if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=[392,440,523,587,659,587,523,440,392,523,587,659];const st=audio.currentTime;notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,st+i*.16);g.gain.exponentialRampToValueAtTime(.075,st+i*.16+.02);g.gain.exponentialRampToValueAtTime(.0001,st+i*.16+.14);o.connect(g).connect(audio.destination);o.start(st+i*.16);o.stop(st+i*.16+.15)});playVoice();if(found)startDance()};loadModel();
</script></body></html>
