<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jugo de Uva — Realidad Aumentada</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}#ui{position:fixed;z-index:20;top:0;left:0;right:0;padding:16px;text-align:center;color:#fff;background:linear-gradient(#111c,transparent);pointer-events:none;text-shadow:0 2px 8px #000}#ui h1{margin:0 0 5px;font-size:24px}#ui p{margin:0;font-size:14px}#music{position:fixed;z-index:30;right:14px;top:14px;border:0;border-radius:999px;padding:11px 15px;background:#fff;color:#5a1a8a;font-weight:800;box-shadow:0 4px 18px #0005}.status{position:fixed;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);background:#111d;color:#fff;border-radius:999px;padding:10px 16px;white-space:nowrap;box-shadow:0 4px 16px #0005}#music.ready{animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.06)}}</style></head>
<body><div id="ui"><h1>🍇 Jugo de Uva cobra vida</h1><p>Apunta la cámara a la cara de la caja.</p></div><button id="music" class="ready">🎵 Activar canción</button><div class="status" id="status">Buscando la caja…</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading:no; uiError:no; uiScanning:no" color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded><a-light type="ambient" intensity="1.7"></a-light><a-light type="directional" intensity="1.2" position="-1 2 2"></a-light><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex:0"><a-entity id="character" position="0 0 0.12" scale="0.78 0.78 0.78"><a-box position="0 0.65 0" width="0.72" height="1.05" depth="0.25" color="#6e24a8"></a-box><a-box position="0 0.65 0.135" width="0.63" height="0.94" depth="0.015" color="#7c2db5"></a-box><a-text value="ROSÉS" align="center" position="0 1.05 0.16" width="1.05" color="#fff"></a-text><a-text value="Jugo de Uva" align="center" position="0 0.69 0.16" width="1.18" color="#ffe600"></a-text><a-sphere position="-0.16 0.91 0.18" radius="0.11" color="#f7f7f7"></a-sphere><a-sphere position="0.16 0.91 0.18" radius="0.11" color="#f7f7f7"></a-sphere><a-sphere position="-0.13 0.91 0.27" radius="0.056" color="#18a8db"></a-sphere><a-sphere position="0.13 0.91 0.27" radius="0.056" color="#18a8db"></a-sphere><a-sphere position="-0.12 0.92 0.315" radius="0.024" color="#111"></a-sphere><a-sphere position="0.12 0.92 0.315" radius="0.024" color="#111"></a-sphere><a-box position="0 0.69 0.18" width="0.27" height="0.055" depth="0.035" color="#17121b"></a-box><a-sphere id="mouth" position="0 0.655 0.205" radius="0.055" color="#f04a9b" scale="1 .55 1"></a-sphere><a-entity id="armL" position="-0.43 0.67 0" rotation="0 0 20"><a-cylinder radius="0.055" height="0.43" color="#6e24a8" rotation="0 0 65"></a-cylinder><a-sphere position="-0.21 -0.16 0" radius="0.078" color="#6e24a8"></a-sphere><a-sphere position="-0.26 -0.18 0.02" radius="0.025" color="#6e24a8"></a-sphere><a-sphere position="-0.22 -0.21 0.03" radius="0.025" color="#6e24a8"></a-sphere></a-entity><a-entity id="armR" position="0.43 0.67 0" rotation="0 0 -20"><a-cylinder radius="0.055" height="0.43" color="#6e24a8" rotation="0 0 -65"></a-cylinder><a-sphere position="0.21 -0.16 0" radius="0.078" color="#6e24a8"></a-sphere><a-sphere position="0.26 -0.18 0.02" radius="0.025" color="#6e24a8"></a-sphere><a-sphere position="0.22 -0.21 0.03" radius="0.025" color="#6e24a8"></a-sphere></a-entity><a-entity id="legL" position="-0.18 0.05 0"><a-cylinder radius="0.065" height="0.42" color="#6e24a8"></a-cylinder><a-box position="0 -0.23 0.08" width="0.25" height="0.13" depth="0.29" color="#ffe600"></a-box></a-entity><a-entity id="legR" position="0.18 0.05 0"><a-cylinder radius="0.065" height="0.42" color="#6e24a8"></a-cylinder><a-box position="0 -0.23 0.08" width="0.25" height="0.13" depth="0.29" color="#ffe600"></a-box></a-entity><a-sphere position="-0.22 1.20 0" radius="0.07" color="#52207f"></a-sphere><a-sphere position="-0.11 1.24 0" radius="0.07" color="#52207f"></a-sphere><a-sphere position="0 1.21 0" radius="0.07" color="#52207f"></a-sphere><a-sphere position="0.11 1.24 0" radius="0.07" color="#52207f"></a-sphere><a-sphere position="0.22 1.20 0" radius="0.07" color="#52207f"></a-sphere></a-entity></a-entity></a-scene>
<script>
const target=document.querySelector('#target'),char=document.querySelector('#character'),status=document.querySelector('#status'),btn=document.querySelector('#music'),mouth=document.querySelector('#mouth');let audio=null,active=false;
function initAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function speak(text,delay=0){if(!('speechSynthesis'in window))return;setTimeout(()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.92;u.pitch=1.25;u.volume=1;speechSynthesis.speak(u)},delay)}
function jingle(){initAudio();const notes=[392,440,523,523,587,523,440,392,440,523,659,587,523,440,392];const start=audio.currentTime;notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,start+i*.18);g.gain.exponentialRampToValueAtTime(.08,start+i*.18+.025);g.gain.exponentialRampToValueAtTime(.0001,start+i*.18+.16);o.connect(g).connect(audio.destination);o.start(start+i*.18);o.stop(start+i*.18+.17)});speak('Jugo de uva, jugo de uva',80);speak('¡Jugo de uva!',2600)}
function setAnim(id,prop,to,dur,delay=0){document.querySelector(id).setAttribute('animation__dance',`property:${prop};to:${to};dur:${dur};delay:${delay};dir:alternate;loop:true;easing:easeInOutSine`)}
function startDance(){char.setAttribute('animation__jump','property:position;to:0 .08 .12;dur:420;dir:alternate;loop:true;easing:easeInOutSine');char.setAttribute('animation__sway','property:rotation;to:0 0 3;dur:900;dir:alternate;loop:true;easing:easeInOutSine');setAnim('#armL','rotation','0 0 -42',320);setAnim('#armR','rotation','0 0 42',320,160);setAnim('#legL','rotation','0 0 12',300);setAnim('#legR','rotation','0 0 -12',300,150);mouth.setAttribute('animation__talk','property:scale;to:1 1.35 1;dur:140;dir:alternate;loop:true')}
function stopDance(){['animation__jump','animation__sway'].forEach(x=>char.removeAttribute(x));['armL','armR','legL','legR'].forEach(id=>document.querySelector('#'+id).removeAttribute('animation__dance'));mouth.removeAttribute('animation__talk')}
btn.addEventListener('click',()=>{initAudio();active=true;btn.classList.remove('ready');btn.textContent='🎵 ¡Jugo de Uva!';startDance();jingle()});target.addEventListener('targetFound',()=>{status.textContent='🎉 ¡La caja cobró vida!';startDance();if(active)jingle()});target.addEventListener('targetLost',()=>{status.textContent='Apunta nuevamente a la caja…';stopDance()});
</script></body></html>
